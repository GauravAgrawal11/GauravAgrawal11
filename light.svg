<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="610">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Courier New', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .pulse { animation: blink 1.5s infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1180" height="610" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Terminal Header Bar -->
  <rect x="0" y="0" width="1180" height="48" rx="16" fill="#F8FAFC"/>
  <rect x="0" y="32" width="1180" height="16" fill="#F8FAFC"/>
  <line x1="0" y1="48" x2="1180" y2="48" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Controls -->
  <circle cx="30" cy="24" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="24" r="6" fill="#27C93F"/>
  <text x="95" y="29" fill="#0891B2" class="mono" font-size="14" font-weight="600">profile.sh --live</text>

