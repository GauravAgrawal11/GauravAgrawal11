<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="610">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Courier New', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .pulse { animation: blink 1.5s infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1180" height="610" rx="16" fill="#0A101F" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Terminal Header Bar -->
  <rect x="0" y="0" width="1180" height="48" rx="16" fill="#0F172A"/>
  <rect x="0" y="32" width="1180" height="16" fill="#0F172A"/>
  <line x1="0" y1="48" x2="1180" y2="48" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Controls -->
  <circle cx="30" cy="24" r="6" fill="#FF5F56"/>
  <circle cx="50" cy="24" r="6" fill="#FFBD2E"/>
  <circle cx="70" cy="24" r="6" fill="#27C93F"/>
  <text x="95" y="29" fill="#22D3EE" class="mono" font-size="14" font-weight="600">profile.sh --live</text>

  <!-- Live Badge & Handle Pill (Top Right) -->
  <circle cx="950" cy="24" r="4" fill="#EF4444" class="pulse"/>
  <text x="960" y="28" fill="#EF4444" class="mono" font-size="12" font-weight="700">LIVE</text>
  
  <rect x="1015" y="10" width="140" height="28" rx="14" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
  <text x="1085" y="28" fill="#A5B4FC" class="mono" font-size="12" font-weight="600" text-anchor="middle">@GauravAgrawal11</text>

  <!-- LEFT PANEL: VISUAL.MAP (Portrait Frame) -->
  <rect x="25" y="68" width="410" height="515" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="45" y="96" fill="#22D3EE" class="mono" font-size="13" font-weight="700" letter-spacing="1">VISUAL.MAP</text>
  <line x1="25" y1="110" x2="435" y2="110" stroke="#1E293B" stroke-width="1"/>

  <!-- User Dithered Dark Portrait Image -->
