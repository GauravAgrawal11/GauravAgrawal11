<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" width="100%" height="340">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Courier New', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="1180" height="340" rx="16" fill="#0A101F" stroke="#1E293B" stroke-width="2"/>

  <!-- Top Header Bar -->
  <rect x="0" y="0" width="1180" height="44" rx="16" fill="#0F172A"/>
  <rect x="0" y="28" width="1180" height="16" fill="#0F172A"/>
  <line x1="0" y1="44" x2="1180" y2="44" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title -->
  <circle cx="30" cy="22" r="5.5" fill="#FF5F56"/>
  <circle cx="50" cy="22" r="5.5" fill="#FFBD2E"/>
  <circle cx="70" cy="22" r="5.5" fill="#27C93F"/>
  <text x="95" y="27" fill="#22D3EE" class="mono" font-size="13" font-weight="700">FEATURED.PROJECTS</text>
  <text x="1150" y="27" fill="#94A3B8" class="mono" font-size="12" text-anchor="end">3 Shipped Systems</text>

  <!-- PROJECT CARD 1: AI Teaching Assistant -->
  <g transform="translate(25, 60)">
    <rect width="365" height="255" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="20" y="32" fill="#22D3EE" class="sans" font-size="18" font-weight="700">🤖 AI Teaching Assistant</text>
    <text x="20" y="52" fill="#818CF8" class="mono" font-size="11">github.com/GauravAgrawal11/AI_Teaching_Assitant</text>
    
    <text x="20" y="80" fill="#94A3B8" class="sans" font-size="13" width="325">
      <tspan x="20" dy="0">Online teaching &amp; doubt solving platform</tspan>
      <tspan x="20" dy="18">with LangChain RAG pipeline &amp; Whisper</tspan>
      <tspan x="20" dy="18">lecture transcription serving 500+ students.</tspan>
    </text>

    <!-- Skill Tags -->
    <rect x="20" y="195" width="65" height="24" rx="12" fill="#162032" stroke="#22D3EE" stroke-width="1"/>
    <text x="52" y="211" fill="#22D3EE" class="mono" font-size="10" text-anchor="middle">Python</text>

    <rect x="90" y="195" width="85" height="24" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
    <text x="132" y="211" fill="#A5B4FC" class="mono" font-size="10" text-anchor="middle">LangChain</text>

    <rect x="180" y="195" width="70" height="24" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="215" y="211" fill="#6EE7B7" class="mono" font-size="10" text-anchor="middle">Whisper</text>

    <rect x="255" y="195" width="65" height="24" rx="12" fill="#312E81" stroke="#C084FC" stroke-width="1"/>
    <text x="287" y="211" fill="#E9D5FF" class="mono" font-size="10" text-anchor="middle">Ollama</text>
  </g>

  <!-- PROJECT CARD 2: GetDailyWork -->
  <g transform="translate(407, 60)">
    <rect width="365" height="255" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="20" y="32" fill="#10B981" class="sans" font-size="18" font-weight="700">💼 GetDailyWork Marketplace</text>
    <text x="20" y="52" fill="#818CF8" class="mono" font-size="11">github.com/GauravAgrawal11/GetDailyWork</text>
    
    <text x="20" y="80" fill="#94A3B8" class="sans" font-size="13">
      <tspan x="20" dy="0">Home Services Marketplace Platform with</tspan>
      <tspan x="20" dy="18">Gemini 2.5 AI assistant automating 80%+</tspan>
      <tspan x="20" dy="18">routine customer booking queries.</tspan>
    </text>

    <!-- Skill Tags -->
    <rect x="20" y="195" width="70" height="24" rx="12" fill="#162032" stroke="#22D3EE" stroke-width="1"/>
    <text x="55" y="211" fill="#22D3EE" class="mono" font-size="10" text-anchor="middle">React 18</text>

    <rect x="95" y="195" width="85" height="24" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
    <text x="137" y="211" fill="#A5B4FC" class="mono" font-size="10" text-anchor="middle">TypeScript</text>

    <rect x="185" y="195" width="75" height="24" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="222" y="211" fill="#6EE7B7" class="mono" font-size="10" text-anchor="middle">Supabase</text>

    <rect x="265" y="195" width="80" height="24" rx="12" fill="#312E81" stroke="#C084FC" stroke-width="1"/>
    <text x="305" y="211" fill="#E9D5FF" class="mono" font-size="10" text-anchor="middle">Gemini AI</text>
  </g>

  <!-- PROJECT CARD 3: PDF Slip Processor -->
  <g transform="translate(790, 60)">
    <rect width="365" height="255" rx="10" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <text x="20" y="32" fill="#F43F5E" class="sans" font-size="18" font-weight="700">📄 PDF Slip Processor SaaS</text>
    <text x="20" y="52" fill="#818CF8" class="mono" font-size="11">github.com/GauravAgrawal11/PDF_Slip_Processor</text>
    
    <text x="20" y="80" fill="#94A3B8" class="sans" font-size="13">
      <tspan x="20" dy="0">Full-Stack SaaS microservice auto-detecting,</tspan>
      <tspan x="20" dy="18">cropping &amp; merging PDF slips, cutting</tspan>
      <tspan x="20" dy="18">manual processing time by ~70%.</tspan>
    </text>

    <!-- Skill Tags -->
    <rect x="20" y="195" width="75" height="24" rx="12" fill="#162032" stroke="#22D3EE" stroke-width="1"/>
    <text x="57" y="211" fill="#22D3EE" class="mono" font-size="10" text-anchor="middle">Next.js 14</text>

    <rect x="100" y="195" width="65" height="24" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-width="1"/>
    <text x="132" y="211" fill="#A5B4FC" class="mono" font-size="10" text-anchor="middle">Node.js</text>

    <rect x="170" y="195" width="65" height="24" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="202" y="211" fill="#6EE7B7" class="mono" font-size="10" text-anchor="middle">OpenCV</text>

    <rect x="240" y="195" width="75" height="24" rx="12" fill="#312E81" stroke="#C084FC" stroke-width="1"/>
    <text x="277" y="211" fill="#E9D5FF" class="mono" font-size="10" text-anchor="middle">Supabase</text>
  </g>
</svg>
